name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12', '13']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          extensions: sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction --no-progress -W --with "laravel/framework:^${{ matrix.laravel }}.0"

      - name: Style, static analysis and tests
        run: composer check

  e2e:
    name: Real apps (all profiles)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          extensions: sqlite3, pdo_sqlite
          coverage: none

      - name: Build and test generated apps
        run: bin/e2e
